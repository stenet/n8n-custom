name: Build and Push Docker Image

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # GitHub deaktiviert Schedules in öffentlichen Repos nach 60 Tagen ohne Aktivität;
  # erneutes Aktivieren über die API setzt diesen Zähler zurück
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Workflow aktiv halten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build-and-push.yml/enable"

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and Push n8n Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.AZURE_REGISTRY }}/n8n:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_LAYER_SALT=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
            NO_NPM_CACHE=true