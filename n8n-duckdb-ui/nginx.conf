worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log off;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080;

    location / {
      # Die UI lauscht nur auf localhost und weist Abfragen mit fremdem Host bzw. Origin mit 401 ab
      proxy_pass http://[::1]:4213;
      proxy_http_version 1.1;
      proxy_set_header Host localhost:4213;
      proxy_set_header Origin http://localhost:4213;
      proxy_set_header Connection "";

      # Die UI erhält Katalog-Änderungen über eine dauerhaft offene Verbindung
      proxy_buffering off;
      proxy_read_timeout 1h;
      client_max_body_size 50m;
    }
  }
}
